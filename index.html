<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ツギダレ">
<meta name="theme-color" content="#1f6feb">
<title>ツギダレ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--sub:#5b6570;--bd:#d8dde3;--acc:#1f6feb;--acct:#fff;--r1b:#fde8e8;--r1t:#b42318;--r2b:#fff3cd;--r2t:#8a5a00;--r3b:#e3f6ea;--r3t:#1a7f45;--in:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--card:#1a1f26;--tx:#e8ebef;--sub:#98a2ad;--bd:#2c343d;--acc:#5b9cff;--acct:#07121f;--r1b:#4a1c1c;--r1t:#ffb4ab;--r2b:#473a0e;--r2t:#f5d27a;--r3b:#123524;--r3t:#86e0a8;--in:#232a33}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 0}
header{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
header b{font-size:17px}
header .sm{font-size:12px}
.sm{font-size:12px;color:var(--sub)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 12px}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--sub);margin:0 0 8px}
button,.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;height:44px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button.pri,.btn.pri{background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:600}
button.s,.btn.s{height:32px;font-size:13px;padding:0 10px}
button:disabled{opacity:.45}
.row2{display:flex;gap:8px;margin-top:10px}
.row2>*{flex:1}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:0 0 6px}
textarea{min-height:200px;line-height:1.7}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;border-radius:0;height:56px;background:transparent;color:var(--sub);font-size:13px}
.tabs button.on{color:var(--acc);font-weight:700}
.pg{display:none}.pg.on{display:block}
.pl{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:11px;border:2px solid var(--cc);background:var(--card)}
.bigc{border-top:6px solid var(--cc);margin:-12px -12px 10px;border-radius:14px 14px 0 0}
.big{text-align:center}
.big .nm{font-size:30px;font-weight:700;line-height:1.25}
.big .s{font-size:13px;color:var(--sub);margin-top:6px}
.big .w{font-size:13px;color:var(--sub);margin-top:8px}
.big .w b{color:var(--tx)}
.st{display:inline-block;font-size:16px;font-weight:700;padding:4px 16px;border-radius:9px;margin-top:8px}
.r1{background:var(--r1b);color:var(--r1t)}.r2{background:var(--r2b);color:var(--r2t)}.r3{background:var(--r3b);color:var(--r3t)}
.bt{display:flex;gap:8px;margin-top:12px}
.bt button{flex:1;height:50px;font-size:16px}
.rw{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;margin:0 0 6px;border:1px solid var(--bd);border-left:6px solid var(--cc);border-radius:10px;background:var(--card);cursor:pointer}
.rw.sel{background:var(--in)}
.chip{min-width:54px;text-align:center;font-size:12px;font-weight:700;padding:3px 6px;border-radius:7px;flex:none}
.rt{margin-left:auto;text-align:right;font-size:12px;color:var(--sub);line-height:1.4}
.rt b{color:var(--tx);font-size:13px}
.lane{margin:0 0 14px}
.lane:last-child{margin:0}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lh .c{display:flex;align-items:center;gap:8px}
.lh .c button{width:38px;padding:0;height:34px}
.tr{position:relative;height:10px;background:var(--in);border-radius:5px;margin:0 9px}
.fl{position:absolute;left:0;top:0;height:10px;background:var(--cc);opacity:.55;border-radius:5px}
.dt{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;margin-left:-9px;background:var(--cc);border:2px solid var(--card);font-size:10px;line-height:14px;text-align:center;color:#fff;font-weight:700}
.cs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.cs button{height:34px;font-size:13px;padding:0 10px}
.got{font-size:14px;margin:6px 0}
.ok{color:var(--r3t);font-weight:600}
.warn{color:var(--r2t)}
.ng{color:var(--r1t);font-weight:600}
.dn{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.dn:first-of-type{border-top:0}
.dn.out span:first-child{color:var(--sub);text-decoration:line-through}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--r2b);color:var(--r2t)}
.tag.g{background:var(--r3b);color:var(--r3t)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;display:none}
</style>
</head>
<body>
<div class="wrap">
<header><b>ツギダレ</b><span class="sm" id="hsub"></span></header>

<div class="pg on" id="p0">
  <div class="box" id="bigbox"><div class="hd"><span>次の出番</span><button class="s" onclick="T.undo()">一つ戻す</button></div><div id="big"></div></div>
  <div class="box" id="lstbox"><div class="hd"><span>全員の出番（タップで上に表示）</span></div><div id="lst"></div></div>
  <div class="box" id="lanbox"><div class="hd"><span>会場の進行（終了した試合数）</span></div><div id="lan"></div></div>
  <div class="box" id="pairbox">
    <div class="hd"><span>対戦する2人から進行を更新</span><button class="s" onclick="T.pairClear()">入れ直す</button></div>
    <input type="text" id="qa" placeholder="1人目（漢字・ひらがな）" oninput="T.pairIn('a')" autocomplete="off">
    <div class="cs" id="ca"></div>
    <input type="text" id="qb" placeholder="2人目" oninput="T.pairIn('b')" autocomplete="off">
    <div class="cs" id="cb"></div>
    <div id="pres"></div>
  </div>
  <div class="box" id="dnbox"><div class="hd"><span>終了した選手</span></div><div id="dn"></div></div>
</div>

<div class="pg" id="p1">
  <div class="box">
    <div class="hd"><span>連絡文（入賞のみ・「さん」付け）</span></div>
    <div class="tg"><span>自道場の選手だけ載せる</span><input type="checkbox" id="onlyMine" checked onchange="T.gen()"></div>
    <textarea id="msg"></textarea>
    <div class="row2"><button onclick="T.gen()">作り直す</button><button class="pri" onclick="T.copy()">コピー</button></div>
    <div class="sm" id="msgnote" style="margin-top:8px"></div>
  </div>
</div>

<div class="pg" id="p2">
  <div class="box">
    <div class="hd"><span>道場生名簿</span><span id="ryr"></span></div>
    <div class="row2" style="margin:0 0 10px"><button onclick="T.ryear(-1)">前の年度</button><button onclick="T.ryear(0)">大会の年度</button><button onclick="T.ryear(1)">次の年度</button></div>
    <div id="roster"></div>
  </div>
  <div class="box"><div class="hd"><span>名簿に未登録の自道場の選手</span></div><div id="unreg"></div></div>
</div>

<div class="pg" id="p3">
  <div class="box">
    <div class="hd"><span>大会データ</span></div>
    <div id="evinfo" style="margin-bottom:8px"></div>
    <div class="row2"><label class="btn pri"><input type="file" accept=".json,application/json" hidden onchange="T.loadEv(this)">大会JSONを読み込む</label><label class="btn"><input type="file" accept=".json,application/json" hidden onchange="T.loadRo(this)">名簿を読み込む</label></div>
    <div class="row2"><button onclick="T.sample()">サンプルで試す</button><button onclick="T.dlSample()">サンプルJSONを保存</button></div>
  </div>
  <div class="box"><div class="hd"><span>検算</span></div><div id="chk"></div></div>
  <div class="box"><div class="hd"><span>要確認（資料から分からない項目）</span></div><div id="unk"></div></div>
  <div class="box">
    <div class="hd"><span>設定と保存</span></div>
    <div class="tg"><span>不戦の試合を番号から飛ばして数える</span><input type="checkbox" id="skip" onchange="T.setSkip(this.checked)"></div>
    <div class="sm" id="saveinfo" style="margin:4px 0 8px"></div>
    <div class="row2"><button onclick="T.exp()">結果を書き出す</button><label class="btn"><input type="file" accept=".json,application/json" hidden onchange="T.imp(this)">書き出しを読み込む</label></div>
    <div class="row2"><button onclick="T.resetRes()">結果だけ消す</button><button onclick="T.resetAll()">全データを消す</button></div>
  </div>
  <div class="sm" style="margin:0 0 12px">このページ（HTML）には選手名が入っていません。大会データと名簿は、この端末の中だけに保存されます。</div>
</div>
</div>

<nav class="tabs">
<button class="on" onclick="T.tab(0)">進行</button>
<button onclick="T.tab(1)">連絡文</button>
<button onclick="T.tab(2)">名簿</button>
<button onclick="T.tab(3)">データ</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY='tsugidare.v1.',mem={};
var PAL=['#7F77DD','#1D9E75','#A0703F','#378ADD','#2F9FA8','#B0629A','#888780','#C48A00'];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sg(k){try{var v=localStorage.getItem(KEY+k);return v?JSON.parse(v):null}catch(e){return mem[k]||null}}
var storeOK=true;
function ss(k,v){mem[k]=v;try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){storeOK=false}}
function rm(k){delete mem[k];try{localStorage.removeItem(KEY+k)}catch(e){}}

var EV=sg('event'),RO=sg('roster'),ST=sg('state')||{},HIST=[],COURTS=[],BYK={},RYOFF=0;
function fixST(){ST.done=ST.done||{};ST.res=ST.res||{};ST.out=ST.out||{};ST.skip=!!ST.skip;ST.sel=ST.sel||null;ST.ev=ST.ev||null}
fixST();
function save(){ss('state',ST)}
function snap(){HIST.push(JSON.stringify(ST));if(HIST.length>60)HIST.shift()}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3200)}

/* ---------- 正規化・名簿 ---------- */
function norm(s){s=String(s||'');try{s=s.normalize('NFKC')}catch(e){}
 s=s.replace(/[邊邉]/g,'辺').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/澤/g,'沢').replace(/齋|齊/g,'斎').replace(/濱/g,'浜').replace(/[\s　]/g,'');
 s=s.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60)});return s.toLowerCase()}
function roReading(name){if(!RO||!RO.members)return '';var n=norm(name);for(var i=0;i<RO.members.length;i++){var m=RO.members[i];if(norm(m.name)===n)return m.reading||'';var al=m.aliases||[];for(var j=0;j<al.length;j++)if(norm(al[j])===n)return m.reading||''}return ''}
function fy(ds){var d=ds?new Date(ds):new Date();if(isNaN(d.getTime()))d=new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1}
function evYear(){return fy(EV&&EV.event&&EV.event.date)}
function gradeLabel(g,diff){if(g==null)return '一般';if(g===0)return diff===0?'幼児':'幼児（要確認）';var x=g+diff;if(x<1)return '入会前';if(x<=6)return '小'+x;if(x<=9)return '中'+(x-6);return '卒業見込み'}

/* ---------- 大会データの索引 ---------- */
function index(){
 COURTS=[];if(!EV||!EV.sections)return;
 var cs={};
 EV.sections.forEach(function(sec){
  sec.mm={};sec.pp={};sec.par={};sec.leaf={};
  (sec.players||[]).forEach(function(p){sec.pp[p.id]=p});
  (sec.matches||[]).forEach(function(m){sec.mm[m.no]=m});
  (sec.matches||[]).forEach(function(m){['a','b'].forEach(function(k){var s=m[k];if(!s)return;if(s.player!=null)sec.leaf[s.player]=m.no;else if(s.winner_of!=null)sec.par[s.winner_of]=m.no})});
  sec.cnt=(sec.matches||[]).filter(function(m){return !m.later}).sort(function(x,y){return x.no-y.no});
  var c=String(sec.court);if(!cs[c])cs[c]={id:c,max:0};
  cs[c].max=Math.max(cs[c].max,(sec.order_offset||0)+sec.cnt.length);
 });
 COURTS=Object.keys(cs).sort(function(a,b){var x=parseFloat(a),y=parseFloat(b);return (isNaN(x)||isNaN(y))?a.localeCompare(b):x-y}).map(function(c,i){cs[c].color=PAL[i%PAL.length];return cs[c]});
}
function court(id){for(var i=0;i<COURTS.length;i++)if(COURTS[i].id===String(id))return COURTS[i];return {id:String(id),max:1,color:PAL[0]}}
function clabel(id){var cl=(EV.courts||[]);for(var i=0;i<cl.length;i++)if(String(cl[i].id)===String(id)&&cl[i].label)return cl[i].label;return id+'試合場'}
function rank(sec,no){
 var m=sec.mm[no];if(!m||m.later)return null;
 var list=sec.cnt;
 if(ST.skip)list=list.filter(function(x){var r=ST.res[sec.id+'|'+x.no];return !(r&&r.kind==='wo')});
 for(var i=0;i<list.length;i++)if(list[i].no===no)return (sec.order_offset||0)+i+1;
 return null;
}
function rs(sec,no){return ST.res[sec.id+'|'+no]||null}
function slot(sec,s){if(!s)return null;if(s.player!=null)return s.player;if(s.winner_of!=null)return winner(sec,s.winner_of);return null}
function winner(sec,no){var r=rs(sec,no);if(!r)return null;if(r.w!=null)return r.w;if(r.l!=null){var m=sec.mm[no],a=slot(sec,m.a),b=slot(sec,m.b);return a===r.l?b:(b===r.l?a:null)}return null}
function loser(sec,no){var r=rs(sec,no);if(!r)return null;if(r.l!=null)return r.l;var m=sec.mm[no],a=slot(sec,m.a),b=slot(sec,m.b);if(r.w!=null)return a===r.w?b:(b===r.w?a:null);return null}
function pstate(sec,pid){
 if(ST.out[sec.id+'|'+pid])return {out:true,wd:true};
 var no=sec.leaf[pid];if(no==null)return {none:true};
 while(no!=null){var r=rs(sec,no);if(!r)return {cur:no};
  var w=winner(sec,no);
  if(w===pid){var n=sec.par[no];if(n==null)return {champ:true};no=n;continue}
  if(w!=null||r.l===pid)return {out:true,at:no};
  return {cur:no};}
 return {none:true};
}
function wins(sec,pid){var n=0,no=sec.leaf[pid];while(no!=null){var r=rs(sec,no);if(!r)break;if(winner(sec,no)!==pid)break;if(r.kind!=='wo')n++;no=sec.par[no]}return n}
function isMine(p){if(p.mine!=null)return !!p.mine;var e=(EV&&EV.event)||{},t=p.team||'',al=(e.club_aliases||[]).concat(e.club?[e.club]:[]);return al.some(function(a){return a&&t.indexOf(a)>=0})}
function oppText(sec,no,pid){
 var m=sec.mm[no],a=m.a,b=m.b,o=null;
 var pa=slot(sec,a),pb=slot(sec,b);
 var os=(pa===pid)?b:a,op=(pa===pid)?pb:pa;
 if(op!=null){var p=sec.pp[op];return p?(p.name+(p.team?'（'+p.team+'）':'')):''}
 if(os&&os.winner_of!=null){var rk=rank(sec,os.winner_of);return '第'+(rk!=null?rk:'?')+'試合の勝者'}
 return '不戦（相手なし）';
}
function mineItems(){
 var out=[];BYK={};if(!EV||!EV.sections)return out;
 EV.sections.forEach(function(sec){(sec.players||[]).forEach(function(p){
  if(!isMine(p))return;var st=pstate(sec,p.id),it={sec:sec,p:p,st:st,key:sec.id+'|'+p.id};BYK[it.key]=it;
  if(st.cur!=null){
   var cid=String(sec.court),cc=court(cid);
   it.no=st.cur;it.rk=rank(sec,it.no);it.cid=cid;it.col=cc.color;
   it.rem=it.rk==null?999:it.rk-1-(ST.done[cid]||0);
   it.path=[];var n=sec.par[it.no];while(n!=null){var r=rank(sec,n);it.path.push(r!=null?r:'別');n=sec.par[n]}
   it.opp=oppText(sec,it.no,p.id);
  }
  out.push(it)})});
 return out;
}
function cls(r){return r<=1?'r1':r<=4?'r2':'r3'}
function remText(r){return r>=999?'試合順は会場で確認':r<0?'試合中の可能性':r===0?'次が出番':'あと'+r+'試合前'}
function pill(cid){return '<span class="pl" style="--cc:'+court(cid).color+'">'+esc(clabel(cid))+'</span>'}
function grade(){}

/* ---------- 進行画面 ---------- */
function r0(){
 var has=!!(EV&&EV.sections&&EV.sections.length);
 ['lstbox','lanbox','pairbox','dnbox'].forEach(function(i){$(i).style.display=has?'':'none'});
 if(!has){$('big').innerHTML='<div class="big"><div class="s">大会データがありません。<br>「データ」タブで大会JSONを読み込むか、サンプルで動きを試せます。</div></div><div class="row2"><button class="pri" onclick="T.sample()">サンプルで試す</button><button onclick="T.tab(3)">データへ</button></div>';return}
 var items=mineItems(),act=[],dn=[];
 items.forEach(function(it){if(it.st.cur!=null)act.push(it);else if(!it.st.none)dn.push(it)});
 act.sort(function(a,b){return a.rem-b.rem||a.no-b.no});
 var f=null;if(ST.sel)f=act.filter(function(i){return i.key===ST.sel})[0];if(!f)f=act[0];
 var b='';
 if(f){
  b='<div class="bigc" style="--cc:'+f.col+'"></div><div class="big"><div class="nm">'+esc(f.p.name)+'</div><div class="s">'+pill(f.cid)+'　'+esc(f.sec.name)+'・'+(f.rk!=null?'第'+f.rk+'試合':'試合順は別会場')+(f.opp?'<br>対 '+esc(f.opp):'')+'</div><span class="st '+cls(f.rem)+'">'+remText(f.rem)+'</span><div class="w">'+(f.path.length?'勝てば次の試合　<b>'+f.path.join(', ')+'</b>':'この試合が決勝です')+'</div></div><div class="bt"><button class="pri" onclick="T.res(\''+esc(f.key)+'\',1)">勝ち</button><button onclick="T.res(\''+esc(f.key)+'\',0)">負け</button><button onclick="T.res(\''+esc(f.key)+'\',2)">欠場</button></div>';
 }else b='<div class="big"><div class="s">出番の選手はいません。</div></div>';
 $('big').innerHTML=b;
 var l='';act.forEach(function(it){
  l+='<div class="rw'+(f===it?' sel':'')+'" style="--cc:'+it.col+'" onclick="T.pick(\''+esc(it.key)+'\')"><span class="chip '+cls(it.rem)+'">'+(it.rem>=999?'別':it.rem<=0?'次':'あと'+it.rem)+'</span><span>'+esc(it.p.name)+'<br>'+pill(it.cid)+' <span class="sm">'+(it.rk!=null?'第'+it.rk+'試合':'別会場')+'</span></span><span class="rt">'+(it.path.length?'次の試合<br><b>'+it.path.join(', ')+'</b>':'<b>決勝</b>')+'</span></div>'});
 $('lst').innerHTML=l||'<div class="sm">出番の選手はいません。</div>';
 var g='';COURTS.forEach(function(c){
  var d='',dn=ST.done[c.id]||0;
  act.filter(function(it){return it.cid===c.id&&it.rk!=null}).forEach(function(it){d+='<div class="dt" style="left:'+Math.min(97,Math.max(2,it.rk/c.max*100))+'%">'+esc(it.p.name.charAt(0))+'</div>'});
  g+='<div class="lane" style="--cc:'+c.color+'"><div class="lh">'+pill(c.id)+'<span class="c"><button onclick="T.dn(\''+esc(c.id)+'\',-1)" aria-label="減らす">−</button><b style="min-width:62px;text-align:center">'+dn+'試合済</b><button onclick="T.dn(\''+esc(c.id)+'\',1)" aria-label="増やす">＋</button></span></div><div class="tr"><div class="fl" style="width:'+Math.min(100,dn/c.max*100)+'%"></div>'+d+'</div></div>'});
 $('lan').innerHTML=g;
 var e='';dn.forEach(function(it){
  var lab=it.st.champ?'優勝':it.st.wd?'欠場':(wins(it.sec,it.p.id)===0?'初戦敗退':wins(it.sec,it.p.id)+'勝で敗退');
  e+='<div class="dn'+(it.st.champ?'':' out')+'"><span>'+esc(it.p.name)+'<span class="sm">（'+esc(it.sec.name)+'）</span></span><span class="sm">'+lab+'</span></div>'});
 $('dn').innerHTML=e||'<div class="sm">まだいません。</div>';
}

/* ---------- 名前から進行を更新 ---------- */
var PA=null,PB=null,CAND={a:[],b:[]},CUR=null;
function allPlayers(){var r=[];EV.sections.forEach(function(sec){(sec.players||[]).forEach(function(p){r.push({sec:sec,p:p,key:sec.id+'|'+p.id})})});return r}
function pairIn(w){
 var q=norm($(w==='a'?'qa':'qb').value),o=w==='a'?PB:PA;
 if(w==='a')PA=null;else PB=null;
 var r=[];
 if(q&&EV)r=allPlayers().filter(function(x){if(o&&x.sec!==o.sec)return false;var hay=norm(x.p.name)+'|'+norm(x.p.reading||'')+'|'+norm(roReading(x.p.name));return hay.indexOf(q)>=0}).slice(0,8);
 CAND[w]=r;
 $(w==='a'?'ca':'cb').innerHTML=r.map(function(x,i){return '<button onclick="T.pairPick(\''+w+'\','+i+')">'+esc(x.p.name)+'<span class="sm">&nbsp;'+esc(x.p.team||'')+'</span></button>'}).join('')||(q?'<span class="sm">該当なし。漢字の一部かひらがなで探してください。</span>':'');
 pairUpd();
}
function pairPick(w,i){
 var x=CAND[w][i];if(w==='a')PA=x;else PB=x;
 $(w==='a'?'qa':'qb').value=x.p.name;$(w==='a'?'ca':'cb').innerHTML='';
 var oi=w==='a'?'qb':'qa';
 if(w==='a'&&PB&&PB.sec!==x.sec){PB=null;$(oi).value=''}
 if(w==='b'&&PA&&PA.sec!==x.sec){PA=null;$(oi).value=''}
 pairUpd();
}
function chain(sec,pid){var r=[],n=sec.leaf[pid];while(n!=null){r.push(n);n=sec.par[n]}return r}
function pairUpd(){
 CUR=null;var e=$('pres');
 if(!PA||!PB){e.innerHTML='';return}
 if(PA.key===PB.key){e.innerHTML='<div class="sm">別の選手を選んでください。</div>';return}
 var sec=PA.sec,ca=chain(sec,PA.p.id),cb=chain(sec,PB.p.id),no=null;
 for(var i=0;i<ca.length;i++)if(cb.indexOf(ca[i])>=0){no=ca[i];break}
 if(no==null){e.innerHTML='<div class="sm">この2人が当たる試合が見つかりません。</div>';return}
 var rk=rank(sec,no);CUR={sec:sec,no:no,rk:rk};
 if(rk==null){e.innerHTML='<div class="got">'+esc(PA.p.name)+' 対 '+esc(PB.p.name)+'<br>別会場で行う試合です。試合数は更新できません。</div><div class="row2"><button onclick="T.pairWin(\'a\')">'+esc(PA.p.name)+'の勝ち</button><button onclick="T.pairWin(\'b\')">'+esc(PB.p.name)+'の勝ち</button></div>';return}
 e.innerHTML='<div class="got">'+esc(PA.p.name)+' 対 '+esc(PB.p.name)+'<br>'+esc(sec.name)+'・'+pill(sec.court)+' 会場の'+rk+'試合目</div>'
  +'<div class="row2"><button onclick="T.pairApply(1)">試合中（'+(rk-1)+'試合済）</button><button onclick="T.pairApply(0)">終了（'+rk+'試合済）</button></div>'
  +'<div class="row2"><button onclick="T.pairWin(\'a\')">'+esc(PA.p.name)+'の勝ち</button><button onclick="T.pairWin(\'b\')">'+esc(PB.p.name)+'の勝ち</button></div>';
}
function pairApply(d){if(!CUR||CUR.rk==null)return;snap();var c=String(CUR.sec.court);ST.done[c]=Math.max(0,CUR.rk-d);save();toast(clabel(c)+'を'+ST.done[c]+'試合済にしました');pairClear();render()}
function pairWin(w){
 if(!CUR)return;var x=w==='a'?PA:PB;snap();
 var k=CUR.sec.id+'|'+CUR.no;ST.res[k]={w:x.p.id};
 if(CUR.rk!=null){var c=String(CUR.sec.court);ST.done[c]=Math.max(ST.done[c]||0,CUR.rk)}
 save();toast(x.p.name+'の勝ちを記録しました');pairClear();render();
}
function pairClear(){PA=PB=null;CUR=null;['qa','qb'].forEach(function(i){var e=$(i);if(e)e.value=''});['ca','cb','pres'].forEach(function(i){$(i).innerHTML=''})}

/* ---------- 連絡文 ---------- */
function gen(){
 if(!EV||!EV.sections){$('msg').value='';$('msgnote').textContent='大会データがありません。';return}
 var only=$('onlyMine').checked,lines=[],pending=0,bz=0;
 EV.sections.forEach(function(sec){
  var roots=(sec.matches||[]).filter(function(m){return sec.par[m.no]==null});
  if(!roots.length)return;var root=roots[0],r=rs(sec,root.no);
  if(!r){pending++;return}
  var res=[],w=winner(sec,root.no),l=loser(sec,root.no);
  if(w!=null)res.push(['優勝',w]);if(l!=null)res.push(['準優勝',l]);
  if(sec.bronze==='semifinal_losers'){[root.a,root.b].forEach(function(s){if(s&&s.winner_of!=null){var lo=loser(sec,s.winner_of);if(lo!=null)res.push(['三位',lo])}})}
  var shown=res.filter(function(x){var p=sec.pp[x[1]];return p&&(!only||isMine(p))});
  if(shown.length){lines.push('■'+sec.name);shown.forEach(function(x){lines.push(x[0]+'：'+sec.pp[x[1]].name+'さん')});if(sec.bronze!=='semifinal_losers')bz++}
 });
 var t='【'+((EV.event&&EV.event.name)||'大会')+' 結果報告】\n';
 if(lines.length)t+=lines.join('\n')+'\n';else t+=(pending?'まだ入賞者は確定していません。':'今回は入賞者はいませんでした。')+'\n';
 t+='\nご応援ありがとうございました。';
 $('msg').value=t;
 var n=[];if(pending)n.push('決勝が終わっていない部が'+pending+'つあります。');if(bz)n.push('三位の決め方が「準決勝の敗者」でない部は、三位を入れていません。');
 $('msgnote').textContent=n.join(' ')||'確定した結果だけを入れています。';
}
function copy(){var t=$('msg');t.select();try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){toast('コピーしました')},function(){document.execCommand('copy');toast('コピーしました')})}else{document.execCommand('copy');toast('コピーしました')}}catch(e){toast('コピーできませんでした。長押しでコピーしてください')}}

/* ---------- 名簿 ---------- */
function r2(){
 var yr=evYear()+RYOFF;$('ryr').textContent='令和'+(yr-2018)+'年度';
 if(!RO||!RO.members){$('roster').innerHTML='<div class="sm">名簿が読み込まれていません。「データ」タブから読み込めます。</div>'}
 else{
  var diff=yr-(RO.base_year||yr),ms=RO.members.slice().sort(function(a,b){return (a.grade==null?99:a.grade)-(b.grade==null?99:b.grade)});
  $('roster').innerHTML=ms.map(function(m){var lab=gradeLabel(m.grade,diff);return '<div class="dn"><span>'+esc(m.name)+'<span class="sm">&nbsp;'+(m.reading?esc(m.reading):'読み未入力')+'</span></span><span class="sm">'+(lab.indexOf('卒業')===0?'<span class="tag">'+lab+'</span>':lab)+'</span></div>'}).join('')+'<div class="sm" style="margin-top:8px">名簿の基準：令和'+((RO.base_year||yr)-2018)+'年度。幼児と卒業見込みは、あなたが更新してください。</div>';
 }
 var un=[];
 if(EV&&EV.sections){var seen={};mineItems().forEach(function(it){var n=norm(it.p.name);if(seen[n])return;seen[n]=1;var inRo=RO&&RO.members&&RO.members.some(function(m){return norm(m.name)===n||(m.aliases||[]).some(function(a){return norm(a)===n})});if(!inRo)un.push(it.p.name+'（'+it.sec.name+'）')})}
 $('unreg').innerHTML=un.length?un.map(function(s){return '<div class="dn"><span>'+esc(s)+'</span></div>'}).join(''):'<div class="sm">'+(EV?'ありません。':'大会データがありません。')+'</div>';
}

/* ---------- データ画面 ---------- */
function r3(){
 var info='<div class="sm">大会データなし</div>';
 if(EV){var e=EV.event||{};info='<div>'+esc(e.name||'（名称なし）')+'</div><div class="sm">'+esc(e.date||'日付なし')+'・自道場：'+esc(e.club||'未設定')+'</div>'}
 $('evinfo').innerHTML=info;
 var c='';
 if(EV&&EV.sections)EV.sections.forEach(function(sec){var np=(sec.players||[]).length,nm=(sec.matches||[]).length,ok=(sec.format||'tournament')!=='tournament'||nm===np-1;c+='<div class="dn"><span>'+esc(sec.name)+'<span class="sm">&nbsp;'+esc(clabel(sec.court))+'</span></span><span class="'+(ok?'ok':'ng')+'">人数'+np+'・試合数'+nm+(ok?' OK':' 要確認')+'</span></div>'});
 $('chk').innerHTML=c||'<div class="sm">大会データがありません。</div>';
 var u=(EV&&EV.unknown)||[];var extra=[];
 if(EV&&EV.sections)EV.sections.forEach(function(sec){if(!sec.bronze||sec.bronze==='unknown')extra.push('三位の決め方：'+sec.name)});
 var all=u.concat(extra);
 $('unk').innerHTML=all.length?all.map(function(s){return '<div class="dn"><span>'+esc(s)+'</span><span class="tag">不明</span></div>'}).join(''):'<div class="sm">なし</div>';
 $('skip').checked=!!ST.skip;
 $('saveinfo').textContent=storeOK?'結果は、この端末の中に自動で保存されています。':'この環境では保存できません。結果を書き出して控えてください。';
}

function validateEv(d){
 if(!d||!Array.isArray(d.sections)||!d.sections.length)return '「sections」がありません';
 for(var i=0;i<d.sections.length;i++){var s=d.sections[i];if(s.id==null||s.court==null||!Array.isArray(s.players)||!Array.isArray(s.matches))return '部'+(i+1)+'に id・court・players・matches のどれかがありません'}
 return '';
}
function setEv(d){
 var key=((d.event&&d.event.name)||'')+'|'+((d.event&&d.event.date)||'');
 EV=d;ss('event',EV);
 if(ST.ev!==key){HIST=[];ST={};fixST();ST.ev=key}
 save();index();pairClear();render();
}
function readFile(inp,cb){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{cb(JSON.parse(r.result))}catch(e){toast('読み込めませんでした。JSONの形式を確認してください')}inp.value=''};r.readAsText(f)}

function sampleEv(){
 var n1=['見本 太郎','見本 花子','試験 一郎','試験 二郎','例題 三郎','例題 梅子','仮名 四郎','仮名 桜'],rd1=['みほん たろう','みほん はなこ','しけん いちろう','しけん じろう','れいだい さぶろう','れいだい うめこ','かりな しろう','かりな さくら'];
 var tm=['サンプル道場','サンプル道場','テスト道場A','テスト道場B','テスト道場A','サンプル道場','テスト道場B','テスト道場A'];
 var P1=n1.map(function(n,i){return {id:i+1,name:n,reading:rd1[i].replace(/ /g,''),team:tm[i],mine:i===0||i===1||i===5}});
 var M1=[{no:1,a:{player:1},b:{player:2}},{no:2,a:{player:3},b:{player:4}},{no:3,a:{player:5},b:{player:6}},{no:4,a:{player:7},b:{player:8}},{no:5,a:{winner_of:1},b:{winner_of:2}},{no:6,a:{winner_of:3},b:{winner_of:4}},{no:7,a:{winner_of:5},b:{winner_of:6}}];
 var n2=['例文 甲','例文 乙','例文 丙','例文 丁','例文 戊','例文 己','例文 庚'];
 var P2=n2.map(function(n,i){return {id:i+1,name:n,reading:'',team:i===1||i===4?'サンプル道場':'テスト道場C',mine:i===1||i===4}});
 var M2=[{no:1,a:{player:1},b:{player:2}},{no:2,a:{player:3},b:{player:4}},{no:3,a:{player:5},b:{player:6}},{no:4,a:{winner_of:1},b:{winner_of:2}},{no:5,a:{winner_of:3},b:{player:7}},{no:6,a:{winner_of:4},b:{winner_of:5}}];
 var P3=[{id:1,name:'標本 桃',team:'テスト道場A',mine:false},{id:2,name:'標本 梨',team:'テスト道場B',mine:false},{id:3,name:'標本 柿',team:'サンプル道場',mine:true}];
 var M3=[{no:1,a:{player:1},b:{player:2}},{no:2,a:{winner_of:1},b:{player:3}}];
 var d=new Date(),ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
 return {event:{name:'サンプル大会',date:ds,club:'サンプル道場',club_aliases:[]},
  courts:[{id:1},{id:2}],
  sections:[{id:'s1',name:'小学3年生',format:'tournament',court:1,order_offset:0,bronze:'semifinal_losers',players:P1,matches:M1},
   {id:'s2',name:'中学1年生男子',format:'tournament',court:2,order_offset:0,bronze:'semifinal_losers',players:P2,matches:M2},
   {id:'s3',name:'中学1年生女子',format:'tournament',court:2,order_offset:6,bronze:'unknown',players:P3,matches:M3}],
  unknown:['開始時刻','準決勝・決勝の会場'],check:{note:'サンプルです'}};
}
function sampleRo(){return {club:'サンプル道場',base_year:evYear(),members:[{name:'見本 太郎',reading:'みほんたろう',grade:3},{name:'見本 花子',reading:'みほんはなこ',grade:3},{name:'例文 乙',reading:'',grade:7},{name:'標本 柿',reading:'ひょうほんかき',grade:8},{name:'例題 梅子',reading:'れいだいうめこ',grade:3}]}}
function download(name,obj){try{var b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},500)}catch(e){toast('書き出せませんでした')}}

function render(){
 $('hsub').textContent=EV&&EV.event?(EV.event.name||''):'';
 r0();r2();r3();
}

/* ---------- 公開する操作 ---------- */
window.T={
 tab:function(i){var b=document.querySelectorAll('.tabs button'),p=document.querySelectorAll('.pg');for(var k=0;k<b.length;k++){b[k].className=k===i?'on':'';p[k].className='pg'+(k===i?' on':'')}if(i===1)gen();if(i===2)r2();if(i===3)r3();window.scrollTo(0,0)},
 undo:function(){if(!HIST.length){toast('戻せる操作がありません');return}ST=JSON.parse(HIST.pop());fixST();save();render()},
 pick:function(k){ST.sel=k;save();r0()},
 res:function(key,t){
  var it=BYK[key];if(!it)return;var sec=it.sec,pid=it.p.id,st=pstate(sec,pid);if(st.cur==null)return;
  snap();var no=st.cur,k=sec.id+'|'+no,rk=rank(sec,no),c=String(sec.court);
  if(t===1)ST.res[k]={w:pid};else if(t===0)ST.res[k]={l:pid,w:null};else{ST.res[k]={l:pid,w:null,kind:'wo'};ST.out[sec.id+'|'+pid]=1}
  if(rk!=null)ST.done[c]=Math.max(ST.done[c]||0,rk);
  ST.sel=null;save();render();
 },
 dn:function(c,v){snap();ST.done[c]=Math.max(0,(ST.done[c]||0)+v);save();r0()},
 pairIn:pairIn,pairPick:pairPick,pairApply:pairApply,pairWin:pairWin,pairClear:pairClear,
 gen:gen,copy:copy,
 ryear:function(d){RYOFF=d===0?0:RYOFF+d;r2()},
 loadEv:function(inp){readFile(inp,function(d){var e=validateEv(d);if(e){toast('大会JSONを読み込めません：'+e);return}setEv(d);toast('大会データを読み込みました')})},
 loadRo:function(inp){readFile(inp,function(d){if(!d||!Array.isArray(d.members)){toast('名簿JSONに「members」がありません');return}RO=d;ss('roster',RO);render();toast('名簿を読み込みました')})},
 sample:function(){setEv(sampleEv());RO=sampleRo();ss('roster',RO);render();T.tab(0);toast('サンプルを読み込みました（架空の名前です）')},
 dlSample:function(){download('tsugidare-sample-event.json',sampleEv())},
 setSkip:function(v){snap();ST.skip=!!v;save();render()},
 exp:function(){var d=new Date();download('tsugidare-results-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json',{app:'tsugidare',version:1,state:ST})},
 imp:function(inp){readFile(inp,function(d){if(!d||d.app!=='tsugidare'||!d.state){toast('ツギダレの書き出しファイルではありません');return}snap();ST=d.state;fixST();save();render();toast('結果を読み込みました')})},
 resetRes:function(){if(!confirm('勝ち負けと試合数の記録を消します。大会データと名簿は残ります。よろしいですか？'))return;snap();var ev=ST.ev;ST={};fixST();ST.ev=ev;save();render()},
 resetAll:function(){if(!confirm('大会データ・名簿・結果をすべてこの端末から消します。よろしいですか？'))return;EV=null;RO=null;ST={};fixST();HIST=[];rm('event');rm('roster');rm('state');index();pairClear();render()}
};

index();render();
})();
</script>
